[project]
name = "autoclaude-cli"
version = "1.6.0"
description = "Local runner for AutoClaude. Executes orchestration plans with your Claude Max/Pro subscription."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Grezy Software" }]
keywords = ["claude", "automation", "cli", "saas", "autoclaude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "tomli-w>=1.0.0",
    "filelock>=3.13.0",
]

[project.urls]
Homepage = "https://github.com/grezy-software/autoclaude-cli"
Issues = "https://github.com/grezy-software/autoclaude-cli/issues"

[project.scripts]
autoclaude = "autoclaude.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoclaude"]

[tool.ruff]
output-format = "grouped"
line-length = 150
indent-width = 4
target-version = "py311"

lint.select = [
    "F", "E", "W", "C90", "I", "N", "D", "UP", "YTT", "ANN", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10",
    "EM", "FA", "ISC", "ICN", "LOG", "G", "INP", "PIE", "T20", "PYI", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "INT",
    "ARG", "PTH", "FIX", "ERA", "PGH", "PL", "TRY", "FLY", "PERF", "FURB", "RUF",
]
lint.ignore = [
    # Ruff formatter recommendations
    "W19",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "ISC001",
    "ISC002",
    # Other
    "PLR0913",          # Less than 5 arguments
    "D107",             # Docstring in __init__
    "D100",             # Module documentation
    "D104",             # Docstring in public package
    "PGH004",           # Noqa all
    "RUF012",
    "FIX002",
    "T201",             # print
    "T203",             # pprint
    "G004",             # f string in logging statement
    "D105",             # Docstring in magic method
    "D101",             # Missing docstring in public class
    "D102",             # Missing docstring in public method
    "D103",             # Missing docstring in public function
    "ANN401",           # Dynamically typed expressions (Any)
    "S603",             # subprocess untrusted input
    "S607",             # Starting a process with a partial executable path
    "TRY003",           # Exception message length
    "EM101",            # Exception must not use a string literal
    "EM102",            # Exception must not use an f-string literal
    "PLR2004",          # Magic values in comparisons
]

lint.fixable = ["ALL"]
lint.unfixable = []

lint.exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
lint.pydocstyle.convention = "google"
lint.mccabe.max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"*__init__.py" = [
    "F401",      # Import in __all__
    "F403",      # Unused import
]
"**/tests/**" = [
    "S101",      # Use of assert (standard in pytest)
    "ANN",       # Type annotations (pytest fixtures)
    "D101",      # Missing docstring in public class
    "D102",      # Missing docstring in public method
    "D103",      # Missing docstring in public function
    "INP001",    # Implicit namespace package
]
"**/test_*.py" = [
    "S101",
    "ANN",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "lf"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.14.4",
]
