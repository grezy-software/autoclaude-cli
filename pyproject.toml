[project]
name = "autoclaude"
version = "0.1.0"
description = "Local runner for AutoClaude. Executes orchestration plans with your Claude Max/Pro subscription."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Grezy Software" }]
keywords = ["claude", "automation", "cli", "saas", "autoclaude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "tomli-w>=1.0.0",
    "platformdirs>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/grezy-software/autoclaude-cli"
Issues = "https://github.com/grezy-software/autoclaude-cli/issues"

[project.scripts]
autoclaude = "autoclaude.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoclaude"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ANN", "S"]
ignore = ["ANN101", "ANN102", "ANN401", "S603", "S607"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.7.0",
]
