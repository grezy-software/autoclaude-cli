name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - name: Install semantic-release
        run: npm install --save-dev semantic-release

      - name: Determine next version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -o pipefail
          OUTPUT=$(npx semantic-release --dry-run 2>&1 | tee /dev/stderr)
          NEXT=$(echo "$OUTPUT" | grep -oE 'The next release version is [0-9]+\.[0-9]+\.[0-9]+[^ ]*' | awk '{print $NF}' | head -n 1)
          if [ -z "$NEXT" ]; then
            echo "No new release"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Next version: v$NEXT"
            echo "version=$NEXT" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        if: steps.version.outputs.skip == 'false'
        uses: astral-sh/setup-uv@v8

      - name: Set up Python
        if: steps.version.outputs.skip == 'false'
        run: uv python install 3.13

      - name: Update project version on pyproject.toml
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv version "$VERSION"

      - name: Build distribution
        if: steps.version.outputs.skip == 'false'
        run: uv build

      - name: Publish to PyPI (Trusted Publishers)
        if: steps.version.outputs.skip == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Release
        if: steps.version.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release
