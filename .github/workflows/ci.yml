name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v8
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --all-extras --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
